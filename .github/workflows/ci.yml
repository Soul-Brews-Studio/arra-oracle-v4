name: CI

# R13 (docs/overnight/DECISIONS.md): the CI promise from 09-21 15:04 that was
# never kept. On push and pull_request only — no cron, to spare Actions
# minutes on a private repo. Nat can add one later.
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Default is 360 minutes; without this a hung shard burns exactly the
    # private-repo Actions minutes R13 exists to save. 25 is generous headroom
    # over the ~500s measured single-process full-suite wall time.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runtime is pinned exactly: app/server/src/composition.ts refuses to
      # start unless Bun is exactly 1.3.14 (see AGENTS.md / architecture recipe).
      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # app/migrate-py/pyproject.toml only requires ">=3.10" (no exact pin, no
      # .python-version file). 3.12 matches the interpreter actually recorded
      # in app/migrate-py/.venv (measured: Python 3.12.13) so CI runs the same
      # interpreter line developers do.
      - name: Set up uv + Python (matches app/migrate-py's .venv, 3.12)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "app/migrate-py/uv.lock"
          python-version: "3.12"

      # `bun run typecheck` in app/server shells out to a bare `tsc` on PATH;
      # package.json intentionally carries no `typescript` devDependency
      # (measured, docs/overnight/... docs-drift audit: "requires a tsc on
      # PATH"). GitHub's runners do not have one, so install the same version
      # this slice verified locally (`tsc --version` -> 7.0.2). This is a CI
      # toolchain step, not a new product dependency — no package.json changes.
      - name: Install tsc (app/server's typecheck needs one on PATH)
        run: npm install -g typescript@7.0.2

      # Cache Bun's global install cache (shared by both bun.lock files below).
      # oven-sh/setup-bun already caches the Bun executable itself; this caches
      # downloaded packages so `--frozen-lockfile` installs skip the network.
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/server/bun.lock', 'app/ui/v2/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: bun install (app/server, frozen lockfile)
        working-directory: app/server
        run: bun install --frozen-lockfile

      # Cheap: measured 798ms Vite build for 86 modules locally.
      - name: bun install (app/ui/v2, frozen lockfile)
        working-directory: app/ui/v2
        run: bun install --frozen-lockfile

      - name: uv sync (app/migrate-py, frozen)
        run: uv sync --project app/migrate-py --frozen

      - name: Typecheck (app/server)
        working-directory: app/server
        run: bun run typecheck

      - name: Build (app/server)
        working-directory: app/server
        run: bun run build

      # Sharded full suite: `bun run test` runs every file in one process
      # (measured 2026-09-26 on f919369: 1123 tests / 68 files, 496.65s wall,
      # 114% CPU — almost serial). test.parallel.ts splits the same file list
      # across TEST_SHARDS `bun test` processes with separate TMPDIRs, balanced
      # by test.census.tsv, and fails if any file is missing from the summary.
      # TEST_SHARDS=4 per DECISIONS.md R13. Risk, not fact: GitHub's standard
      # Linux runner is 2 vCPU on a private repo (4 vCPU is the public-repo
      # runner) — 4 shards over 2 cores may see per-test timeouts or a longer
      # wall time than 4 real cores would give. Unverified on GitHub itself
      # (never run there yet); revisit TEST_SHARDS if that shows up.
      - name: Test — sharded full suite (app/server)
        working-directory: app/server
        env:
          TEST_SHARDS: 4
          # bun defaults to 5 s per test; the runner is ~5x slower than the dev
          # box (shards took 914-1036 s in run 36253113031), and two gated tests
          # crossed 5 s there.
          TEST_TIMEOUT_MS: 60000
        run: bun run test:parallel

      # Keeps the overnight capstone demo (app/just/demo.sh, docs/overnight/
      # DEMO.md) honest with no GPU and no real Ollama: the test itself
      # stands up a `Bun.serve` stub for the three Ollama endpoints the
      # server ever calls, runs the REAL script against it (a real fresh
      # mktemp dataset, a real gated server, real CLI + MCP calls), and
      # asserts every step's success marker. Independent of the sharded
      # suite above -- it imports no server kernel module directly, so it is
      # not part of test.census.tsv/test.order.txt (see test.order.ts's own
      # header: it only scans app/server/test).
      - name: Test — demo.sh, stubbed Ollama (app/just/demo.test.ts)
        working-directory: app
        run: bun test just/demo.test.ts

      # app/migrate-py has no pytest.ini/pyproject [tool.pytest] section and no
      # pytest package in its lockfile (measured: `python -m pytest --version`
      # -> "No module named pytest"). The real, documented command is
      # unittest discover (app/docs/contracts/v1-codecs.md:59-62), which this
      # slice ran clean: 139 tests, 1 skipped, OK, ~8s.
      - name: Upload shard logs when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-parallel-shard-logs
          path: app/server/.tmp/test-parallel/
          if-no-files-found: ignore

      - name: Test — Python (app/migrate-py, unittest discover)
        run: |
          PYTHONPATH=app/migrate-py/src app/migrate-py/.venv/bin/python \
            -m unittest discover -s app/migrate-py/tests -v

      # unittest discover does NOT descend into tests/fixtures/*-v1/ (neither
      # directory has an __init__.py; both files say so in their own
      # docstrings). app/docs/contracts/taxonomy-write-v1.md:98 requires
      # "Python discovery plus explicit new fixture suite with
      # ResourceWarning-as-error" as a gate, so these two run explicitly, with
      # the same -W flag the contract names. Measured: 17 OK + 22 OK, ~15s.
      - name: Test — Python fixture suites (not reached by discovery)
        run: |
          cd app/migrate-py
          PYTHONPATH=src:tests .venv/bin/python -W error::ResourceWarning \
            tests/fixtures/publication-v1/test_export_publication_fixture.py -v
          PYTHONPATH=src:tests .venv/bin/python -W error::ResourceWarning \
            tests/fixtures/taxonomy-v1/test_export_taxonomy_fixture.py -v

      # app/benchmarks' own tests (harness, corpus, metrics, retrieval_metrics)
      # use the same venv. Measured 2026-09-26 after the #7 harness slice: "Ran 123 tests in 0.194s OK".
      - name: Test — Python (app/benchmarks)
        working-directory: app/benchmarks
        run: ../migrate-py/.venv/bin/python -m unittest discover -s . -p 'test_*.py' -v

      - name: Build UI v2
        working-directory: app/ui/v2
        run: bun run build
