<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>arra-oracle-v4 — memories</title>
<style>
  :root { --bg:#0a0a0f; --fg:#e8e8ef; --dim:#9a9aa8; --accent:#64b5f6; --line:#23232e; --panel:#12121a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
  main { max-width:750px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:18px; margin:0 0 2px; color:var(--accent); font-weight:600; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--dim);
         background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:20px; }
  .bar b { color:var(--fg); font-weight:600; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .up { background:#4caf50; } .down { background:#e53935; }
  section { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:14px; margin-bottom:16px; }
  h2 { font-size:13px; margin:0 0 10px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  input, textarea, select, button { font:inherit; font-size:14px; background:#0e0e16; color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:8px 10px; width:100%; }
  textarea { resize:vertical; min-height:64px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .row > * { flex:1 1 150px; }
  button { background:var(--accent); color:#06121f; border:none; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:active { transform:translateY(1px); }
  .hit { border-top:1px solid var(--line); padding:10px 0; }
  .hit:first-of-type { border-top:none; }
  .hit .meta { font-size:12px; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; }
  .hit .content { margin-top:4px; white-space:pre-wrap; word-break:break-word; }
  .tag { border:1px solid var(--line); border-radius:4px; padding:0 5px; }
  .vec { color:var(--accent); }
  .novec { color:#c9873f; }
  .empty { color:var(--dim); font-size:13px; }
  .msg { font-size:13px; margin-top:8px; min-height:18px; color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>arra-oracle-v4 — memories</h1>
  <div class="sub">Python owns the schema · TypeScript serves it · LanceDB · local prototype · bearer token required</div>

  <div class="bar" id="bar"><span>loading…</span></div>

  <section>
    <h2>Write a memory</h2>
    <div class="row">
      <input id="name" placeholder="name (slug)" />
      <input id="token" type="password" placeholder="bearer token (kept in memory only)" autocomplete="off" />
      <button class="ghost" id="logout">Log out</button>
      <input id="bank" placeholder="bank (default)" />
      <input id="type" placeholder="type (note)" />
    </div>
    <textarea id="content" placeholder="content — ภาษาไทยก็ค้นเจอ"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="add">Save</button>
      <button class="ghost" id="backfill">Backfill all banks (admin)</button>
    </div>
    <div class="msg" id="writeMsg"></div>
  </section>

  <section>
    <h2>Search</h2>
    <div class="row">
      <input id="q" placeholder="query" />
      <select id="mode">
        <option value="text">full-text (icu)</option>
        <option value="vector">semantic (configured model)</option>
      </select>
      <input id="qbank" placeholder="read bank (default)" />
    </div>
    <div class="row"><button id="go">Search</button></div>
    <div class="msg" id="searchMsg"></div>
  </section>

  <section>
    <h2 id="resultsTitle">Recent</h2>
    <div id="results"><div class="empty">nothing yet</div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

const readBank = () => $("qbank").value.trim() || $("bank").value.trim() || "default";

// The token lives ONLY in this variable, for the lifetime of the page.
// It is deliberately never written to any persistent browser store, cookie,
// URL or static asset: anything persistent outlives the tab and stays
// readable by other code running on this origin.
let authToken = "";
const setToken = (value) => { authToken = typeof value === "string" ? value.trim() : ""; };
const logout = () => {
  authToken = "";
  const input = $("token");
  if (input) input.value = "";
};

// One shared wrapper reads the variable AT CALL TIME, so logout takes effect
// immediately for in-flight UI rather than leaving a captured copy behind.
async function request(url, options) {
  const opts = { ...(options || {}) };
  const headers = new Headers(opts.headers || {});
  if (authToken) headers.set("authorization", `Bearer ${authToken}`);
  opts.headers = headers;
  // A redirect could carry the credential to another origin.
  opts.redirect = "error";
  opts.cache = "no-store";
  const response = await fetch(url, opts);
  const result = await response.json();
  if (response.status === 401 || response.status === 403) {
    // Generic: never surface which grant was missing or which object exists.
    throw new Error("access denied");
  }
  if (!response.ok || result.error) throw new Error(result.error || `HTTP ${response.status}`);
  return result;
}

// Public liveness carries no credential at all.
async function publicRequest(url) {
  const response = await fetch(url, { cache: "no-store", redirect: "error" });
  return response.json();
}

async function health() {
  try {
    const h = await request(`/api/health?bank=${encodeURIComponent(readBank())}`);
    if (h.error) { $("bar").innerHTML = `<span><i class="dot down"></i>${esc(h.error)}</span>`; return; }
    // The server sanitizes diagnostics to {ok, dims} and scoped counts only:
    // no model address, no storage URI, no index list, no dataset version.
    // Render exactly those fields -- reading absent ones printed "undefined".
    const e = h.embedder, d = h.db;
    $("bar").innerHTML = `
      <span><i class="dot ${e.ok ? "up" : "down"}"></i>embedder ${e.ok ? "ready" : "unavailable"} ${esc(e.dims)}d</span>
      <span>rows <b>${esc(d.rows)}</b></span>
      <span>embedded <b>${esc(d.embedded)}</b></span>
      <span>pending <b>${esc(d.unembedded)}</b></span>`;
  } catch (err) { $("bar").innerHTML = `<span><i class="dot down"></i>${esc(err)}</span>`; }
}

function render(rows, title) {
  $("resultsTitle").textContent = title;
  $("results").innerHTML = rows.length ? rows.map((r) => `
    <div class="hit">
      <div class="meta">
        <span class="tag">${esc(r.workspace_name)}</span>
        <span class="tag">${esc(r.type)}</span>
        <b>${esc(r.name)}</b>
        <span class="${r.embedded ? "vec" : "novec"}">${r.embedded ? "vector" : "no vector"}</span>
        ${r.score !== undefined ? `<span>score ${r.score.toFixed(3)}</span>` : ""}
        ${r.distance !== undefined ? `<span>dist ${r.distance.toFixed(3)}</span>` : ""}
      </div>
      <div class="content">${esc(r.content)}</div>
    </div>`).join("") : `<div class="empty">no rows</div>`;
}

async function recent() {
  try {
    const bank = readBank();
    const rows = await request(`/api/memories?bank=${encodeURIComponent(bank)}&limit=25`);
    render(rows, `Recent — ${bank}`);
  } catch (error) { $("results").textContent = String(error); }
}

$("add").onclick = async () => {
  const body = { name: $("name").value.trim() || "untitled", content: $("content").value.trim(),
                 workspace_name: $("bank").value.trim() || "default", type: $("type").value.trim() || "note" };
  if (!body.content) { $("writeMsg").textContent = "content is empty"; return; }
  $("writeMsg").textContent = "saving…";
  try {
    const r = await request("/api/memories", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body) });
    $("writeMsg").textContent = `saved ${r.id} — ${r.embedded ? "embedded" : "pending embedding; run backfill when ready"}`;
    $("content").value = "";
    $("qbank").value = body.workspace_name;
    await health(); await recent();
  } catch (error) { $("writeMsg").textContent = String(error); }
};

$("backfill").onclick = async () => {
  $("writeMsg").textContent = "backfilling across ALL banks…";
  try {
    const r = await request("/api/backfill", { method:"POST" });
    $("writeMsg").textContent = `embedded ${r.embedded}, ${r.remaining} still pending (all banks)`;
    await health(); await recent();
  } catch (error) { $("writeMsg").textContent = String(error); }
};

$("go").onclick = async () => {
  const q = $("q").value.trim();
  if (!q) return;
  const bank = readBank();
  $("searchMsg").textContent = "searching…";
  const url = `/api/search?q=${encodeURIComponent(q)}&mode=${$("mode").value}&bank=${encodeURIComponent(bank)}`;
  try {
    const r = await request(url);
    // The response does not echo the bank back; use the one this page chose.
    // Text mode reports how it matched: "ngram", or "substring_scan" for a query under 3 characters.
    $("searchMsg").textContent = `${r.count} hit(s) · ${esc(r.mode)}${r.match ? ` · ${esc(r.match)}` : ""} · bank ${esc(bank)}`;
    render(r.rows, `Results — ${esc(r.mode)} — ${esc(bank)}`);
  } catch (error) { $("searchMsg").textContent = String(error); }
};
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });

$("token").oninput = () => setToken($("token").value);
$("logout").onclick = () => { logout(); $("bar").textContent = "logged out"; };
$("qbank").onchange = async () => { await health(); await recent(); };
$("bank").onchange = async () => { if (!$("qbank").value.trim()) { await health(); await recent(); } };
health(); recent();
</script>
</body>
</html>
