[package]
name = "arra-v4-migrate"
version = "0.1.0"
edition = "2021"

[dependencies]
# 0.38.0 does not compile with default features: job.rs uses Error::Http, gated behind "remote".
# Pin matches lancedb-oracle/apps/rust — proven to build there 2026-09-18.
lancedb = { version = "0.38.0", features = ["remote"] }
arrow-array = "58"
arrow-schema = "58"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
